name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open, reviewed formula pull request to land
        required: true
      head_sha:
        description: Exact head SHA that passed every test-bot job
        required: true
      merged_pr_recovery:
        description: 'Emergency only: recover an already-merged formula PR'
        required: false
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: brew-pr-pull
  cancel-in-progress: false

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    steps:
      - name: Validate dispatch before Homebrew setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          MERGED_PR_RECOVERY: ${{ inputs.merged_pr_recovery }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          fail() {
            echo "::error title=$1::$2"
            exit 1
          }

          test "$GITHUB_REF" = "refs/heads/main" || \
            fail "Invalid dispatch branch" "Dispatch brew pr-pull from main."

          live_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$live_main" = "$GITHUB_SHA" || \
            fail "Stale main dispatch" "The dispatch commit is no longer current main. Dispatch the workflow again."

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST")"
          actual_head="$(jq -r .head.sha <<<"$pr_json")"
          base_ref="$(jq -r .base.ref <<<"$pr_json")"
          draft="$(jq -r .draft <<<"$pr_json")"
          state="$(jq -r .state <<<"$pr_json")"
          merged="$(jq -r .merged <<<"$pr_json")"

          test "$base_ref" = "main" || \
            fail "Invalid formula PR base" "PR #$PULL_REQUEST must target main."
          test "$actual_head" = "$HEAD_SHA" || \
            fail "Formula PR head changed" "PR #$PULL_REQUEST no longer matches the tested head $HEAD_SHA."

          if [[ "$MERGED_PR_RECOVERY" = "true" ]]; then
            test "$merged" = "true" || \
              fail "Invalid recovery request" "merged_pr_recovery is only valid for an already-merged formula PR."
          else
            if [[ "$state" != "open" || "$merged" != "false" ]]; then
              if [[ "$merged" = "true" ]]; then
                fail "Formula PR already merged" "PR #$PULL_REQUEST is already merged. Review the recovery guards, then dispatch from main with merged_pr_recovery=true."
              fi
              fail "Formula PR is not open" "PR #$PULL_REQUEST must remain open for the ordinary brew pr-pull path."
            fi
            test "$draft" = "true" || \
              fail "Formula PR is ready to merge" "PR #$PULL_REQUEST must remain a draft so GitHub cannot land it before brew pr-pull."
          fi

          required_checks=(
            "test-bot (macos-26)"
            "test-bot (macos-15-intel)"
            "test-bot (ubuntu-latest, ghcr.io/homebrew/brew:main, --privileged)"
            "test-bot (ubuntu-24.04-arm, ghcr.io/homebrew/brew:main, --privileged)"
          )
          if [[ "$MERGED_PR_RECOVERY" != "true" ]]; then
            required_checks+=("publish-runtime" "formula-landing-policy")
          fi
          check_json="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100")"
          for check in "${required_checks[@]}"; do
            conclusion="$(jq -s -r --arg check "$check" '
              [.[].check_runs[] |
                select(.name == $check and .app.slug == "github-actions")] |
              max_by(.id) | .conclusion // ""
            ' <<<"$check_json")"
            test "$conclusion" = "success" || \
              fail "Formula PR checks incomplete" "The latest GitHub Actions check '$check' at $HEAD_SHA concluded '$conclusion', not 'success'."
          done

      - name: Create publisher token
        id: publisher_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BREW_COMMIT_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_PUBLISHER_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          token: ${{ steps.publisher_token.outputs.token }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1

      - name: Pull bottles
        id: pull_bottles
        env:
          GH_TOKEN: ${{ steps.publisher_token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.publisher_token.outputs.token }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          MERGED_PR_RECOVERY: ${{ inputs.merged_pr_recovery }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          args=(--debug --retain-bottle-dir "--tap=$GITHUB_REPOSITORY" "--head-sha=$HEAD_SHA")
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST")"
          actual_head="$(jq -r .head.sha <<<"$pr_json")"
          base_ref="$(jq -r .base.ref <<<"$pr_json")"
          draft="$(jq -r .draft <<<"$pr_json")"
          state="$(jq -r .state <<<"$pr_json")"
          merged="$(jq -r .merged <<<"$pr_json")"

          test "$base_ref" = "main"
          test "$actual_head" = "$HEAD_SHA"
          git fetch --no-tags origin \
            "refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          test "$(git rev-parse "refs/remotes/origin/$base_ref")" = "$GITHUB_SHA"

          if [[ "$MERGED_PR_RECOVERY" != "true" ]]; then
            test "$draft" = "true"
            if [[ "$state" != "open" || "$merged" != "false" ]]; then
              if [[ "$merged" = "true" ]]; then
                echo "::error title=Formula PR already merged::PR #$PULL_REQUEST is already merged. The ordinary brew pr-pull path owns landing. Review the recovery guards, then dispatch from main with merged_pr_recovery=true."
              else
                echo "::error title=Formula PR is not open::PR #$PULL_REQUEST must remain open for the ordinary brew pr-pull path."
              fi
              exit 1
            fi
            brew pr-pull "${args[@]}" "$PULL_REQUEST"
            exit 0
          fi

          base_sha="$(jq -r .base.sha <<<"$pr_json")"
          merge_sha="$(jq -r .merge_commit_sha <<<"$pr_json")"

          test "$merged" = "true"
          git fetch --no-tags origin "refs/pull/$PULL_REQUEST/head"
          git cat-file -e "$base_sha^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git cat-file -e "$merge_sha^{commit}"
          read -r commit parent_one parent_two extra < <(git rev-list --parents -n 1 "$merge_sha")
          test "$commit" = "$merge_sha"
          test "$parent_one" = "$base_sha"
          test "$parent_two" = "$HEAD_SHA"
          test -z "${extra:-}"
          git merge-base --is-ancestor "$merge_sha" origin/main
          git diff --quiet "$HEAD_SHA" HEAD -- Formula/

          GITHUB_SHA="$base_sha" brew pr-pull \
            "${args[@]}" --no-cherry-pick --clean "$PULL_REQUEST"

      - name: Attest bottles
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          branch: main
